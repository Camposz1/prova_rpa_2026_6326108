name: CI - Prova RPA 2026

on:
  push:
    branches: [ "master" ]
    paths:
      - "entregas/**"
      - ".flake8"
      - "requirements.txt"
      - ".github/workflows/ci_prova.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "master" ]
    paths:
      - "entregas/**"
      - ".flake8"
      - "requirements.txt"
      - ".github/workflows/ci_prova.yml"

jobs:
  validar_prova:
    name: Lint e Execução – Prova
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # OBS: entregas/_MODELO contem os contratos-molde (com NotImplementedError).
      # O flake8 ignora a pasta via .flake8 e os passos de execucao abaixo
      # filtram esse caminho com -not -path '*/_MODELO/*'.
      - name: Verificar estilo (PEP8 / flake8)
        run: |
          if [ -d entregas ]; then
            flake8 entregas/
          else
            echo "Pasta entregas/ ainda não existe — nada a analisar."
          fi

      - name: Q1 – config_conexao.py
        run: |
          found=$(find entregas -type f -name 'config_conexao.py' -not -path '*/_MODELO/*' 2>/dev/null)
          if [ -n "$found" ]; then
            echo "$found" | while read -r f; do echo ">> $f"; python "$f"; done
          else
            echo "Nenhum config_conexao.py encontrado — pulando."
          fi

      - name: Q2 – monitor_sensores.py
        run: |
          found=$(find entregas -type f -name 'monitor_sensores.py' -not -path '*/_MODELO/*' 2>/dev/null)
          if [ -n "$found" ]; then
            echo "$found" | while read -r f; do echo ">> $f"; python "$f"; done
          else
            echo "Nenhum monitor_sensores.py encontrado — pulando."
          fi

      - name: Q3 – main.py
        run: |
          found=$(find entregas -type f -name 'main.py' -not -path '*/_MODELO/*' 2>/dev/null)
          if [ -n "$found" ]; then
            echo "$found" | while read -r f; do
              echo ">> $f";
              # Roda a partir da pasta do arquivo para o import de mod_estoque funcionar.
              ( cd "$(dirname "$f")" && python "$(basename "$f")" );
            done
          else
            echo "Nenhum main.py encontrado — pulando."
          fi

      - name: Q4 – importador_notas.py
        run: |
          found=$(find entregas -type f -name 'importador_notas.py' -not -path '*/_MODELO/*' 2>/dev/null)
          if [ -n "$found" ]; then
            echo "$found" | while read -r f; do
              echo ">> $f";
              # Roda a partir da pasta do arquivo para achar o CSV (ex.: notas.csv).
              ( cd "$(dirname "$f")" && python "$(basename "$f")" );
            done
          else
            echo "Nenhum importador_notas.py encontrado — pulando."
          fi
